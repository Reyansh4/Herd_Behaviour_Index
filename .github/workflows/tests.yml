# Run tests, lint, and sample-data schema check on push/PR

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=methodology --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov (optional)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Validate sample data schema
        run: python tests/validate_sample_schema.py

      - name: Lint with ruff
        run: ruff check methodology/ tests/ --ignore E501
        continue-on-error: true
